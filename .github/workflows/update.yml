name: Five-minute verified data refresh

on:
  schedule:
    # UTC target; GitHub may delay or drop scheduled runs under load.
    - cron: "*/5 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'script.js'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

# Only one update at a time. Newer runs queue; in-progress runs finish first.
concurrency:
  group: market-hours-data-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest discover -s tests -v

      - run: node tests/frontend.cjs

      - run: python scripts/fetch_data.py
        if: github.event_name != 'pull_request'
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      - name: Save actual execution and validation attempts
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/market-attempts.json
            work/execution.json
          retention-days: 7

      - name: Commit data if changed
        if: github.event_name != 'pull_request'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"

          # Never resolve a data conflict with ours: a newer snapshot must win.
          # A rejected push fails visibly; the next run fetches the latest branch.
          git push

      # Commits made with GITHUB_TOKEN do not automatically rebuild Pages.
      - name: Request publication of refreshed data
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
