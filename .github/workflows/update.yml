name: Five-minute verified data refresh

on:
  schedule:
    # Recovery trigger; the worker supplies the five-minute cadence.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'script.js'
      - 'index.html'
      - 'requirements.txt'
      - '.github/workflows/update.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'script.js'
      - 'requirements.txt'
      - '.github/workflows/update.yml'

concurrency:
  group: market-refresh-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.cjs

  update:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      pages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish dashboard code
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Refresh sources and commit every five minutes for five hours
        id: worker
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/refresh_loop.py
      - name: Start successor without waiting for cron
        if: success() && steps.worker.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run update.yml --ref "$DEFAULT_BRANCH"
      - name: Save execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            work/market-attempts.json
            work/execution.json
          retention-days: 7
