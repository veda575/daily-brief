name: Market-hours data refresh

on:
  schedule:
    # Asia + India session, hourly, Mon-Fri: 00:00-10:00 UTC
    # (KRX opens 00:00 UTC, HKEX/SSE ~01:30 UTC, NSE 03:45-10:00 UTC)
    - cron: "0 0-10 * * 1-5"
    # US session, hourly, Mon-Fri: 13:00-21:00 UTC
    # (NYSE/Nasdaq 9:30am-4pm ET = 13:30-20:00 UTC in EDT, 14:30-21:00 UTC in EST;
    # the wider window covers both without needing to track the DST switch)
    - cron: "0 13-21 * * 1-5"
  workflow_dispatch:

# Only one update at a time. Newer runs queue; in-progress runs finish first.
concurrency:
  group: market-hours-data-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python scripts/fetch_data.py
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}

      - name: Commit data if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M') UTC"

          # Retry push if remote moved while we were running.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected on attempt $attempt — pulling latest and retrying…"
            git pull --no-rebase --strategy-option=ours --no-edit origin main
          done
          echo "Push failed after 3 attempts." >&2
          exit 1
